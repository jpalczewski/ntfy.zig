name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  ZIGLINT_VERSION: v0.5.3
  ZIGLINT_SHA256: 7560bf5ad36170ae1560505a5e273c83376534feccad23a9f7be716f94853539

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"

      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src

      - name: Lint (zlinter)
        run: zig build lint -- --max-warnings 0

      - name: Install ziglint
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/rockorager/ziglint/releases/download/${ZIGLINT_VERSION}/ziglint-x86_64-linux.tar.gz" \
            --output "${RUNNER_TEMP}/ziglint.tar.gz"
          echo "${ZIGLINT_SHA256}  ${RUNNER_TEMP}/ziglint.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/ziglint.tar.gz" -C "${RUNNER_TEMP}"
          sudo install -m 0755 "${RUNNER_TEMP}/ziglint" /usr/local/bin/ziglint

      - name: Lint (ziglint)
        run: ziglint src build.zig

      - name: Run tests
        run: zig build test

      - name: Build
        run: zig build

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
