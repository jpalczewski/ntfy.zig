name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  ZIGLINT_VERSION: v0.5.3
  ZIGLINT_SHA256: 7560bf5ad36170ae1560505a5e273c83376534feccad23a9f7be716f94853539

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"

      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src

      - name: Lint (zlinter)
        run: zig build lint -- --max-warnings 0

      - name: Install ziglint
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/rockorager/ziglint/releases/download/${ZIGLINT_VERSION}/ziglint-x86_64-linux.tar.gz" \
            --output "${RUNNER_TEMP}/ziglint.tar.gz"
          echo "${ZIGLINT_SHA256}  ${RUNNER_TEMP}/ziglint.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/ziglint.tar.gz" -C "${RUNNER_TEMP}"
          sudo install -m 0755 "${RUNNER_TEMP}/ziglint" /usr/local/bin/ziglint

      - name: Lint (ziglint)
        run: ziglint src build.zig

      - name: Run tests
        run: zig build test

      - name: Build
        run: zig build

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
