name: Zig dependency updates

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-deps:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"

      - name: Refresh git-based Zig dependencies
        run: ./scripts/update-zig-deps.sh

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # A PR opened with the default GITHUB_TOKEN can't trigger other
          # workflows (e.g. ci.yml on pull_request), to prevent workflow
          # recursion. ZIG_DEPS_PAT is a repo-scoped PAT (Contents +
          # Pull requests: read/write) that doesn't have that restriction.
          # Falls back to GITHUB_TOKEN if the secret isn't set, so this
          # keeps working (just without auto-triggered CI) until it is.
          token: ${{ secrets.ZIG_DEPS_PAT || secrets.GITHUB_TOKEN }}
          commit-message: "build: update zig dependencies"
          title: "build: update zig dependencies"
          body: |
            Automated update of git-based dependencies in `build.zig.zon`
            to the latest commit on their tracked branch.

            CI must pass before merging — this PR is not auto-merged.
          branch: zig-deps-update
