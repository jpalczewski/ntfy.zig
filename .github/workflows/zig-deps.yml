name: Zig dependency updates

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"

      - uses: muhammad-fiaz/zig-dependabot@3de70e81e0a44c5e4ae1fa1d2561fc13373967c7 # v1.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
